# 템플릿 게이트(lint · typecheck · 디자인 토큰)를 GitHub 에서 다시 돌린다.
#
# 판단 로직은 여기 두지 않는다. `npm run verify` 를 부르기만 한다 — 규칙은 레포 안
# (eslint.config.mjs · scripts/)에 있고, 이 파일은 forge 가 바뀌면 버려도 되는 얇은 래퍼다.
#
# 로컬 git 훅(pre-commit · pre-push)은 `git commit -n`·`HUSKY=0` 으로 건너뛸 수 있고,
# 작업 트리를 볼 뿐 커밋된 내용을 보지 않는다. 이 워크플로가 그 두 구멍을 메운다.
#
# 러너·기본 브랜치 규칙은 조직 워크플로(codeql.yml)와 같다.

name: verify

on:
  pull_request:
  push:
    # 기본 브랜치명은 on: 에 적을 수 없다(표현식 미지원). job 의 if 에서 거른다.
    branches: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ vars.RUNNER_LABEL || 'arc-runner' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # npm 캐시는 package-lock.json 이 있을 때만 — 다른 매니저면 lock 을 못 찾아 실패한다.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      # check:tokens 가 파이썬 스크립트다(scripts/run-python.mjs 가 인터프리터를 찾는다).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # 프로젝트마다 매니저가 다를 수 있다. 버전은 package.json 의 packageManager 를
      # corepack 이 읽어 맞춘다. 설치만 다르고 그 뒤는 전부 `npm run` 이다.
      - run: corepack enable
      - name: install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ] && [ -f .yarnrc.yml ]; then yarn install --immutable
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm ci
          fi
      - run: npm run verify
      - run: npm run test:gate
